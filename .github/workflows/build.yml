name: Build

# Lancé uniquement à la demande (onglet Actions -> Build -> Run workflow).
# Produit une archive par plateforme, disponible en artifacts du run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Empaquetage
        shell: bash
        run: |
          mkdir -p dist/Sapiens
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/Sapiens.exe" dist/Sapiens/
          else
            cp "target/${{ matrix.target }}/release/Sapiens" dist/Sapiens/
          fi
          cp LICENSE.txt README.md dist/Sapiens/
          cd dist
          if [ "$RUNNER_OS" = "Linux" ]; then
            tar -czf "Sapiens-${{ matrix.name }}.tar.gz" Sapiens
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a "Sapiens-${{ matrix.name }}.zip" Sapiens
          else
            zip -r "Sapiens-${{ matrix.name }}.zip" Sapiens
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: Sapiens-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  web:
    name: web (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked trunk
      - run: trunk build --release
        env:
          RUSTUP_TOOLCHAIN: nightly
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
      - name: Empaquetage
        run: |
          cd target/web
          zip -r ../../Sapiens-web.zip .
      - uses: actions/upload-artifact@v6
        with:
          name: Sapiens-web
          path: Sapiens-web.zip
          if-no-files-found: error
