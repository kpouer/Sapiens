[package]
name = "Sapiens"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
bytemuck = { version = "1.25", features = ["min_const_generics"] }
byteorder = "1.5.0"
cpal = { version = "0.18.2", default-features = false }
eframe = "0.37"
egui = "0.37"
log = "0.4.34"
rfd = "0.18"
strum = { version = "0.28", features = ["derive"] }
sys-locale = "0.3.2"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[features]
default = []
OLD_VERSION = []
